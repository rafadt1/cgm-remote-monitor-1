<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prumo</title>
<meta name="description" content="Sua vida organizada: pacientes, conteúdo, saúde e dinheiro.">
<meta name="theme-color" content="#F3EFED">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Prumo">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#D37E1D; --accent-soft:#F6E6D3; --text:#333333; --bg:#F3EFED;
  --card:#FFFFFF; --muted:#8C8581; --line:#ECE6E2; --low:#B4483A;
  --radius:20px; --shadow:0 1px 2px rgba(51,51,51,.04),0 8px 24px rgba(51,51,51,.05);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font-family:Montserrat,system-ui,sans-serif;font-weight:400;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,.p{font-family:Poppins,system-ui,sans-serif;margin:0}
h1{font-weight:800;font-size:28px;letter-spacing:-.02em;line-height:1.15}
h2{font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:36px 4px 12px}
h3{font-weight:600;font-size:16px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 28px) 20px calc(env(safe-area-inset-bottom) + 140px)}
.muted{color:var(--muted)} .small{font-size:13px} .accent{color:var(--accent)}

/* header */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.date{font-size:13px;color:var(--muted);margin-bottom:6px}
.lvl{display:flex;flex-direction:column;align-items:center;gap:4px}
.ring{position:relative;width:54px;height:54px}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:Poppins;font-weight:700;font-size:17px}
.streak{font-size:11px;color:var(--muted);font-weight:500;white-space:nowrap}

/* segments & chips */
.seg{display:flex;gap:22px;margin:28px 4px 0;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{font-family:Poppins;font-weight:600;font-size:14px;color:var(--muted);padding:6px 0;border-bottom:2px solid transparent;white-space:nowrap}
.seg button.on{color:var(--text);border-color:var(--accent)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:20px -20px 0;padding:0 20px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{font-size:13px;font-weight:500;padding:7px 14px;border-radius:99px;background:transparent;border:1px solid var(--line);white-space:nowrap;color:var(--muted)}
.chip.on{background:var(--text);border-color:var(--text);color:#fff}

/* cards & rows */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:6px 18px}
.card.pad{padding:22px}
.card + .card{margin-top:12px}
.row{display:flex;align-items:center;gap:14px;padding:15px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .body{flex:1;min-width:0;cursor:pointer}
.row .t{font-weight:500;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:12.5px;color:var(--muted);margin-top:1px}
.row.done .t{text-decoration:line-through;color:var(--muted)}
.check{width:24px;height:24px;flex:none;border-radius:50%;border:1.5px solid #CFC7C2;display:grid;place-items:center;transition:.2s}
.check svg{opacity:0;transition:.2s}
.check.on{background:var(--accent);border-color:var(--accent)}
.check.on svg{opacity:1}
.check.pop{animation:pop .35s ease}
@keyframes pop{50%{transform:scale(1.25)}}
.tag{font-size:11px;font-weight:500;color:var(--muted);letter-spacing:.02em;white-space:nowrap}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-right:6px;vertical-align:middle}
.prio-3 .t::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-left:8px;vertical-align:middle}
.pill{font-size:11.5px;font-weight:500;padding:4px 10px;border-radius:99px;background:var(--bg);white-space:nowrap}
.pill.a{background:var(--accent-soft);color:#9A5A12}
.btn{font-family:Poppins;font-weight:600;font-size:14px;padding:12px 20px;border-radius:14px;background:var(--text);color:#fff}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.acc{background:var(--accent)}
.btn.sm{padding:8px 14px;font-size:13px;border-radius:12px}
.link{font-weight:500;font-size:13px;color:var(--accent)}
.empty{padding:28px 6px;text-align:center;color:var(--muted);font-size:14px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat .v{font-family:Poppins;font-weight:700;font-size:24px;line-height:1.1}
.stat .l{font-size:12px;color:var(--muted);margin-top:4px}
.big{font-family:Poppins;font-weight:800;font-size:34px;letter-spacing:-.02em;line-height:1.1}
.bar{height:6px;background:var(--bg);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .5s}
.bar.dark i{background:var(--text)}
.between{display:flex;justify-content:space-between;align-items:center;gap:12px}
.stack>*+*{margin-top:14px}
.hab{display:flex;align-items:center;gap:14px;cursor:pointer}

/* nav + fab */
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 8px calc(env(safe-area-inset-bottom) + 8px);z-index:10}
nav .in{max-width:560px;margin:0 auto;display:flex;justify-content:space-around}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:500;color:var(--muted);padding:6px 8px;min-width:58px}
nav button.on{color:var(--accent)}
.fab{position:fixed;right:max(20px,calc(50% - 260px));bottom:calc(env(safe-area-inset-bottom) + 84px);width:56px;height:56px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;box-shadow:0 10px 24px rgba(211,126,29,.35);z-index:11}

/* sheet */
.ov{position:fixed;inset:0;background:rgba(51,51,51,.28);z-index:20;opacity:0;transition:.2s}
.ov.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--card);border-radius:26px 26px 0 0;max-height:88vh;overflow:auto;padding:12px 22px calc(env(safe-area-inset-bottom) + 24px);transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);max-width:560px;margin:0 auto}
.sheet.show{transform:none}
.grab{width:38px;height:4px;border-radius:9px;background:var(--line);margin:0 auto 18px}
.sheet h3{font-size:20px;font-weight:700;margin-bottom:18px}
.f{margin-bottom:14px}
.f label{display:block;font-size:12px;font-weight:500;color:var(--muted);margin-bottom:6px}
.f input,.f select,.f textarea{width:100%;font:inherit;font-size:16px;color:var(--text);background:var(--bg);border:1px solid transparent;border-radius:12px;padding:12px 14px;outline:none;-webkit-appearance:none;appearance:none}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--accent);background:#fff}
.f textarea{min-height:84px;resize:vertical}
.f.err input{border-color:var(--low)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.actions{display:flex;gap:10px;margin-top:22px}
.actions .btn{flex:1}
.del{color:var(--low);font-weight:500;font-size:14px;display:block;margin:18px auto 0}

/* toast */
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 16px);transform:translate(-50%,-30px);opacity:0;background:var(--text);color:#fff;padding:10px 18px;border-radius:99px;font-size:13.5px;font-weight:500;z-index:30;transition:.3s;white-space:nowrap}
.toast b{color:#F2B266;font-family:Poppins}
.toast.show{opacity:1;transform:translate(-50%,0)}
.lvlup{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgba(243,239,237,.94);opacity:0;pointer-events:none;transition:.3s;text-align:center;padding:24px}
.lvlup.show{opacity:1;pointer-events:auto}
.lvlup .n{font-family:Poppins;font-weight:800;font-size:96px;color:var(--accent);line-height:1}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<button class="fab" id="fab" aria-label="Adicionar">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>
<nav><div class="in" id="nav"></div></nav>
<div class="toast" id="toast"></div>
<div class="lvlup" id="lvlup"></div>

<script>
/* ===================== utilidades ===================== */
const KEY = 'prumo.v1';
const z = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate());
const today = () => ymd(new Date());
const addDays = (s, n) => { const d = new Date(s + 'T12:00'); d.setDate(d.getDate() + n); return ymd(d); };
const diffDays = (a, b) => Math.round((new Date(a + 'T12:00') - new Date(b + 'T12:00')) / 864e5);
const uid = () => Math.random().toString(36).slice(2, 10);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = v => Number(v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const num = v => Number(v || 0).toLocaleString('pt-BR');
function fmtDate(s) {
  if (!s) return '';
  const t = today();
  if (s === t) return 'Hoje';
  if (s === addDays(t, 1)) return 'Amanhã';
  if (s === addDays(t, -1)) return 'Ontem';
  return new Date(s + 'T12:00').toLocaleDateString('pt-BR', { weekday: 'short', day: '2-digit', month: 'short' }).replace(/\./g, '');
}
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const monthName = m => { const d = new Date(m + '-15T12:00'); return cap(d.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' })); };

/* ===================== dados ===================== */
const AREAS = { pacientes: 'Pacientes', conteudo: 'Conteúdo', saude: 'Saúde', dinheiro: 'Dinheiro', pessoal: 'Pessoal' };
const POST_STATUS = ['ideia', 'roteiro', 'gravado', 'agendado', 'postado'];
const CATS = ['Alimentação', 'Casa', 'Transporte', 'Saúde', 'Lazer', 'Compras', 'Assinaturas', 'Educação', 'Outros'];
const LEVELS = ['Semente', 'Broto', 'Raiz', 'Caule', 'Ramo', 'Folha', 'Flor', 'Fruto', 'Árvore', 'Bosque', 'Floresta'];
const DEF = () => ({
  name: '', xp: 0, history: {},
  tasks: [], patients: [], appts: [], posts: [], metrics: [], funnel: [],
  habits: [
    { id: 'h1', name: 'Beber 2 litros de água', xp: 5 },
    { id: 'h2', name: 'Exercício físico', xp: 10 },
    { id: 'h3', name: 'Dormir 7h ou mais', xp: 5 },
    { id: 'h4', name: 'Registrar glicemias', xp: 5 }
  ],
  habitLog: {},
  devices: [
    { id: 'd1', name: 'Sensor', last: '', interval: 14 },
    { id: 'd2', name: 'Cateter / local de infusão', last: '', interval: 3 }
  ],
  glucose: [], exams: [], expenses: [], budget: 0, goals: []
});
let S;
try { S = Object.assign(DEF(), JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) { S = DEF(); }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { } }
const UI = { tab: 'hoje', seg: { pacientes: 'agenda', conteudo: 'calendario', saude: 'habitos', dinheiro: 'gastos' }, filter: 'todas', showDone: false, month: today().slice(0, 7) };

/* ===================== gamificação ===================== */
function level(xp) {
  let lv = 1, need = 100, rest = xp;
  while (rest >= need) { rest -= need; lv++; need = 100 + (lv - 1) * 50; }
  return { lv, rest, need, title: LEVELS[Math.min(lv - 1, LEVELS.length - 1)] };
}
function streak() {
  let d = today(), n = 0;
  if (!S.history[d]) d = addDays(d, -1);
  while (S.history[d] > 0) { n++; d = addDays(d, -1); }
  return n;
}
function gain(n, label) {
  const before = level(S.xp).lv;
  S.xp = Math.max(0, S.xp + n);
  const t = today();
  S.history[t] = Math.max(0, (S.history[t] || 0) + (n > 0 ? 1 : -1));
  save();
  if (n > 0) toast(`<b>+${n} XP</b> &nbsp;${esc(label)}`);
  const after = level(S.xp).lv;
  if (after > before) levelUp(after);
}
let toastT;
function toast(html) {
  const el = document.getElementById('toast');
  el.innerHTML = html; el.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 1800);
}
function levelUp(lv) {
  const el = document.getElementById('lvlup');
  el.innerHTML = `<div><div class="muted small" style="letter-spacing:.1em;text-transform:uppercase">Novo nível</div>
    <div class="n">${lv}</div><h1 style="margin-top:8px">${LEVELS[Math.min(lv - 1, LEVELS.length - 1)]}</h1>
    <p class="muted" style="max-width:260px;margin:12px auto 28px">Você está cuidando de todas as áreas da sua vida. Continue assim.</p>
    <button class="btn acc" onclick="this.closest('.lvlup').classList.remove('show')">Continuar</button></div>`;
  el.classList.add('show');
}

/* ===================== formulário genérico (bottom sheet) ===================== */
function openForm({ title, fields, onSave, onDelete, saveLabel = 'Salvar' }) {
  closeSheet();
  const ov = document.createElement('div'); ov.className = 'ov';
  const sh = document.createElement('div'); sh.className = 'sheet';
  const field = f => {
    const v = f.value ?? '';
    let input;
    if (f.type === 'select') input = `<select name="${f.k}">${f.options.map(o => { const [val, lab] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(val)}" ${String(val) === String(v) ? 'selected' : ''}>${esc(lab)}</option>`; }).join('')}</select>`;
    else if (f.type === 'textarea') input = `<textarea name="${f.k}" placeholder="${esc(f.ph || '')}">${esc(v)}</textarea>`;
    else input = `<input name="${f.k}" type="${f.type || 'text'}" value="${esc(v)}" placeholder="${esc(f.ph || '')}" ${f.type === 'number' ? 'inputmode="decimal" step="any"' : ''}>`;
    return `<div class="f" data-k="${f.k}"><label>${esc(f.label)}</label>${input}</div>`;
  };
  let html = '', i = 0;
  while (i < fields.length) {
    const f = fields[i];
    if (f.half && fields[i + 1] && fields[i + 1].half) { html += `<div class="two">${field(f)}${field(fields[i + 1])}</div>`; i += 2; }
    else { html += field(f); i++; }
  }
  sh.innerHTML = `<div class="grab"></div><h3>${esc(title)}</h3><form>${html}
    <div class="actions"><button type="button" class="btn ghost" data-x>Cancelar</button><button class="btn acc">${esc(saveLabel)}</button></div>
    ${onDelete ? '<button type="button" class="del" data-del>Excluir</button>' : ''}</form>`;
  document.body.append(ov, sh);
  requestAnimationFrame(() => { ov.classList.add('show'); sh.classList.add('show'); });
  ov.onclick = closeSheet;
  sh.querySelector('[data-x]').onclick = closeSheet;
  if (onDelete) sh.querySelector('[data-del]').onclick = () => { if (confirm('Excluir este item?')) { onDelete(); closeSheet(); } };
  sh.querySelector('form').onsubmit = e => {
    e.preventDefault();
    const vals = {}; let ok = true;
    fields.forEach(f => {
      const el = sh.querySelector(`[name="${f.k}"]`);
      let v = el.value.trim();
      if (f.req && !v) { ok = false; el.closest('.f').classList.add('err'); }
      if (f.type === 'number') v = v === '' ? '' : Number(v.replace(',', '.'));
      vals[f.k] = v;
    });
    if (!ok) return;
    onSave(vals); closeSheet();
  };
  const first = sh.querySelector('input,textarea');
  if (first && !fields[0].value) setTimeout(() => first.focus(), 300);
}
function closeSheet() {
  document.querySelectorAll('.ov,.sheet').forEach(el => { el.classList.remove('show'); setTimeout(() => el.remove(), 280); });
}
function crud(coll, id, [tNew, tEdit], fields, defaults = {}, onCreate) {
  const it = id ? S[coll].find(x => x.id === id) : { ...defaults };
  if (!it) return;
  openForm({
    title: id ? tEdit : tNew,
    fields: fields.map(f => ({ ...f, value: it[f.k] ?? f.def ?? '' })),
    onSave: v => { Object.assign(it, v); if (!id) { it.id = uid(); S[coll].push(it); onCreate && onCreate(it); } save(); render(); },
    onDelete: id ? () => { S[coll] = S[coll].filter(x => x.id !== id); save(); render(); } : null
  });
}

/* ===================== editores ===================== */
const areaOpts = Object.entries(AREAS);
const ed = {
  task: id => crud('tasks', id, ['Nova tarefa', 'Editar tarefa'], [
    { k: 'title', label: 'O que precisa ser feito?', req: true, ph: 'Ex.: Responder directs' },
    { k: 'area', label: 'Área', type: 'select', options: areaOpts, def: UI.filter !== 'todas' ? UI.filter : 'pessoal', half: true },
    { k: 'prio', label: 'Prioridade', type: 'select', options: [['1', 'Baixa'], ['2', 'Média'], ['3', 'Alta']], def: '2', half: true },
    { k: 'date', label: 'Data', type: 'date', def: today(), half: true },
    { k: 'repeat', label: 'Repetir', type: 'select', options: [['', 'Não repete'], ['daily', 'Todo dia'], ['weekdays', 'Dias úteis'], ['weekly', 'Toda semana'], ['monthly', 'Todo mês']], half: true },
    { k: 'notes', label: 'Notas', type: 'textarea' }
  ]),
  patient: id => crud('patients', id, ['Novo paciente', 'Editar paciente'], [
    { k: 'name', label: 'Nome', req: true },
    { k: 'type', label: 'Tipo de acompanhamento', type: 'select', options: [['consulta', 'Consultas avulsas'], ['mentoria', 'Mentoria / acompanhamento']], half: true },
    { k: 'nextCheckin', label: 'Próximo check-in', type: 'date', half: true },
    { k: 'contact', label: 'WhatsApp / contato', type: 'tel' },
    { k: 'goal', label: 'Objetivo', ph: 'Ex.: Melhorar tempo no alvo, contagem de carbo' },
    { k: 'notes', label: 'Evolução e anotações', type: 'textarea' }
  ], { type: 'consulta' }),
  appt: id => {
    if (!S.patients.length) { toast('Cadastre um paciente primeiro'); UI.seg.pacientes = 'lista'; render(); return ed.patient(); }
    crud('appts', id, ['Nova consulta', 'Editar consulta'], [
      { k: 'patientId', label: 'Paciente', type: 'select', options: S.patients.map(p => [p.id, p.name]) },
      { k: 'date', label: 'Data', type: 'date', def: today(), half: true, req: true },
      { k: 'time', label: 'Horário', type: 'time', half: true },
      { k: 'kind', label: 'Tipo', type: 'select', options: ['Primeira consulta', 'Retorno', 'Mentoria', 'Avaliação'], half: true },
      { k: 'status', label: 'Status', type: 'select', options: [['agendada', 'Agendada'], ['confirmada', 'Confirmada'], ['realizada', 'Realizada'], ['faltou', 'Faltou'], ['cancelada', 'Cancelada']], half: true },
      { k: 'link', label: 'Link da chamada', type: 'url', ph: 'https://meet...' },
      { k: 'notes', label: 'Notas', type: 'textarea' }
    ], { status: 'agendada' });
  },
  post: (id, dated) => crud('posts', id, ['Novo conteúdo', 'Editar conteúdo'], [
    { k: 'title', label: 'Tema / título', req: true, ph: 'Ex.: 3 erros na contagem de carbo' },
    { k: 'network', label: 'Rede', type: 'select', options: ['Instagram', 'TikTok', 'Instagram + TikTok'], half: true },
    { k: 'format', label: 'Formato', type: 'select', options: ['Reels', 'Carrossel', 'Stories', 'Vídeo', 'Live', 'Post'], half: true },
    { k: 'status', label: 'Etapa', type: 'select', options: POST_STATUS.map(s => [s, s[0].toUpperCase() + s.slice(1)]), half: true },
    { k: 'date', label: 'Data de postagem', type: 'date', def: dated ? today() : '', half: true },
    { k: 'hook', label: 'Gancho (primeira frase)', ph: 'Ex.: Você corrige a glicemia errado e nem sabe' },
    { k: 'cta', label: 'Chamada para ação', ph: 'Ex.: Comente "GUIA" para receber' },
    { k: 'script', label: 'Roteiro', type: 'textarea' }
  ], { status: dated ? 'roteiro' : 'ideia', network: 'Instagram', format: 'Reels' }),
  metric: id => crud('metrics', id, ['Registrar métricas', 'Editar métricas'], [
    { k: 'date', label: 'Data', type: 'date', def: today(), req: true },
    { k: 'ig', label: 'Seguidores Instagram', type: 'number', half: true },
    { k: 'tt', label: 'Seguidores TikTok', type: 'number', half: true },
    { k: 'reach', label: 'Alcance da semana', type: 'number', half: true },
    { k: 'eng', label: 'Engajamento (%)', type: 'number', half: true }
  ], {}, () => gain(10, 'Métricas registradas')),
  funnel: id => crud('funnel', id, ['Registrar mês do funil', 'Editar funil'], [

/* ===================== agenda unificada ===================== */
const pname = id => (S.patients.find(p => p.id === id) || {}).name || 'Paciente';
function agenda() {
  const items = [];
  S.tasks.filter(x => !x.done).forEach(x => items.push({ kind: 'task', id: x.id, title: x.title, area: x.area, date: x.date, prio: +x.prio, sub: [x.repeat ? 'Repete' : '', x.notes].filter(Boolean).join(' · ') }));
  S.appts.filter(a => ['agendada', 'confirmada'].includes(a.status)).forEach(a => items.push({ kind: 'appt', id: a.id, area: 'pacientes', date: a.date, time: a.time, prio: 3, title: `${a.kind || 'Consulta'} · ${pname(a.patientId)}`, sub: [a.time, a.status === 'confirmada' ? 'Confirmada' : 'A confirmar'].filter(Boolean).join(' · ') }));
  S.patients.filter(p => p.type === 'mentoria' && p.nextCheckin).forEach(p => items.push({ kind: 'checkin', id: p.id, area: 'pacientes', date: p.nextCheckin, prio: 2, title: `Check-in · ${p.name}`, sub: 'Mentoria semanal' }));
  S.posts.filter(p => p.date && p.status !== 'postado').forEach(p => items.push({ kind: 'post', id: p.id, area: 'conteudo', date: p.date, prio: 2, title: p.title, sub: `${p.format} · ${p.network} · ${p.status}` }));
  S.devices.filter(d => d.last).forEach(d => items.push({ kind: 'device', id: d.id, area: 'saude', date: addDays(d.last, +d.interval || 1), prio: 3, title: `Trocar ${d.name.toLowerCase()}`, sub: `A cada ${d.interval} dias` }));
  S.exams.filter(e => !e.done).forEach(e => items.push({ kind: 'exam', id: e.id, area: 'saude', date: e.date, time: e.time, prio: 2, title: e.name, sub: e.time || '' }));
  return items.sort((a, b) => (a.date || '9').localeCompare(b.date || '9') || (a.time || '99').localeCompare(b.time || '99') || b.prio - a.prio);
}
function nextRepeat(date, r) {
  const d = date || today();
  if (r === 'daily') return addDays(d, 1);
  if (r === 'weekly') return addDays(d, 7);
  if (r === 'monthly') { const x = new Date(d + 'T12:00'); x.setMonth(x.getMonth() + 1); return ymd(x); }
  if (r === 'weekdays') { let n = addDays(d, 1); while ([0, 6].includes(new Date(n + 'T12:00').getDay())) n = addDays(n, 1); return n; }
}
function complete(kind, id) {
  const t = today();
  if (kind === 'task') {
    const x = S.tasks.find(i => i.id === id);
    const xp = { 1: 10, 2: 20, 3: 30 }[x.prio] || 20;
    if (x.repeat) { x.date = nextRepeat(x.date && x.date > t ? x.date : t, x.repeat); x.lastDone = t; }
    else { x.done = true; x.doneAt = t; }
    gain(xp, x.title);
  } else if (kind === 'appt') { S.appts.find(i => i.id === id).status = 'realizada'; gain(20, 'Consulta realizada'); }
  else if (kind === 'checkin') { const p = S.patients.find(i => i.id === id); p.lastCheckin = t; p.nextCheckin = addDays(t, 7); gain(25, 'Check-in feito'); }
  else if (kind === 'post') { const p = S.posts.find(i => i.id === id); p.status = 'postado'; if (!p.date || p.date > t) p.date = t; gain(30, 'Conteúdo postado'); }
  else if (kind === 'device') { S.devices.find(i => i.id === id).last = t; gain(10, 'Troca registrada'); }
  else if (kind === 'exam') { S.exams.find(i => i.id === id).done = true; gain(20, 'Cuidado em dia'); }
  save();
}
const openItem = (kind, id) => ({ task: ed.task, appt: ed.appt, checkin: ed.patient, post: ed.post, device: ed.device, exam: ed.exam })[kind](id);

/* ===================== componentes ===================== */
const CHECK = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`;
const checkBtn = (on, act) => `<button class="check ${on ? 'on' : ''}" data-act="${act}" aria-label="Concluir">${CHECK}</button>`;
const seg = (tab, opts) => `<div class="seg">${opts.map(([k, l]) => `<button class="${UI.seg[tab] === k ? 'on' : ''}" data-seg="${tab}:${k}">${l}</button>`).join('')}</div>`;
const empty = t => `<div class="card"><div class="empty">${t}</div></div>`;
const bar = (pct, cls = '') => `<div class="bar ${cls}"><i style="width:${Math.max(0, Math.min(100, pct))}%"></i></div>`;

function header(title, sub) {
  const L = level(S.xp), st = streak(), C = 2 * Math.PI * 24, pct = L.rest / L.need;
  const now = new Date();
  return `<div class="top"><div>
      <div class="date">${cap(now.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' }))}</div>
      <h1>${title}</h1>${sub ? `<div class="muted small" style="margin-top:6px">${sub}</div>` : ''}
    </div>
    <button class="lvl" data-act="profile" aria-label="Seu nível">
      <div class="ring"><svg width="54" height="54"><circle cx="27" cy="27" r="24" fill="none" stroke="#E6DED9" stroke-width="3"/>
        <circle cx="27" cy="27" r="24" fill="none" stroke="#D37E1D" stroke-width="3" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - pct)}"/></svg><b>${L.lv}</b></div>
      <div class="streak">${st} ${st === 1 ? 'dia seguido' : 'dias seguidos'}</div>
    </button></div>`;
}

/* ===================== telas ===================== */
function viewHoje() {
  const h = new Date().getHours();
  const hi = h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite';
  const t = today(), wk = addDays(t, 7);
  let items = agenda();
  if (UI.filter !== 'todas') items = items.filter(i => i.area === UI.filter);
  const groups = [
    ['Atrasadas', items.filter(i => i.date && i.date < t)],
    ['Hoje', items.filter(i => i.date === t)],
    ['Próximos 7 dias', items.filter(i => i.date > t && i.date <= wk)],
    ['Sem data', items.filter(i => !i.date)],
    ['Mais adiante', items.filter(i => i.date > wk)]
  ];
  const todayCount = items.filter(i => i.date && i.date <= t).length;
  const doneToday = S.tasks.filter(x => (x.done && x.doneAt === t) || x.lastDone === t);
  const hl = S.habitLog[t] || [], hd = S.habits.filter(x => hl.includes(x.id)).length;

  const row = i => `<div class="row ${i.prio === 3 && i.kind === 'task' ? 'prio-3' : ''}">
      ${checkBtn(false, `done:${i.kind}:${i.id}`)}
      <div class="body" data-act="open:${i.kind}:${i.id}"><div class="t">${esc(i.title)}</div>
      ${(i.sub || (i.date && !['Hoje'].includes(fmtDate(i.date)))) ? `<div class="s">${[i.date && i.date !== t ? fmtDate(i.date) : '', esc(i.sub)].filter(Boolean).join(' · ')}</div>` : ''}</div>
      ${UI.filter === 'todas' ? `<span class="tag">${AREAS[i.area] || ''}</span>` : ''}</div>`;

  let html = header(`${hi}${S.name ? ', ' + esc(S.name) : ''}`, todayCount ? `${todayCount} ${todayCount === 1 ? 'item' : 'itens'} para hoje` : 'Dia livre. Que tal planejar a semana?');
  html += `<div class="chips">${[['todas', 'Tudo'], ...areaOpts].map(([k, l]) => `<button class="chip ${UI.filter === k ? 'on' : ''}" data-filter="${k}">${l}</button>`).join('')}</div>`;
  if (S.habits.length && (UI.filter === 'todas' || UI.filter === 'saude')) {
    html += `<h2>Hábitos de hoje</h2><div class="card pad" data-act="goto:saude:habitos" style="cursor:pointer">
      <div class="between" style="margin-bottom:12px"><h3>${hd} de ${S.habits.length}</h3><span class="link">Marcar</span></div>${bar(hd / S.habits.length * 100)}</div>`;
  }
  let any = false;
  groups.forEach(([name, list]) => {
    if (!list.length) return; any = true;
    html += `<h2 ${name === 'Atrasadas' ? 'style="color:var(--accent)"' : ''}>${name}</h2><div class="card">${list.map(row).join('')}</div>`;
  });
  if (!any) html += `<h2>Hoje</h2>` + empty('Nada pendente por aqui.<br>Toque no <b class="accent">+</b> para criar uma tarefa.');
  if (doneToday.length) {
    html += `<h2><button data-act="toggleDone" style="font:inherit;letter-spacing:inherit;color:inherit;text-transform:inherit">Concluídas hoje · ${doneToday.length} ${UI.showDone ? '▴' : '▾'}</button></h2>`;
    if (UI.showDone) html += `<div class="card">${doneToday.map(x => `<div class="row done">${checkBtn(true, x.done ? `undo:${x.id}` : 'none')}<div class="body" data-act="open:task:${x.id}"><div class="t">${esc(x.title)}</div></div></div>`).join('')}</div>`;
  }
  return html;
}

function viewPacientes() {
  const t = today();
  let html = header('Pacientes', `${S.patients.length} ${S.patients.length === 1 ? 'paciente' : 'pacientes'} · atendimento online`);
  html += seg('pacientes', [['agenda', 'Agenda'], ['lista', 'Pacientes'], ['mentoria', 'Mentoria']]);
  const s = UI.seg.pacientes;
  if (s === 'agenda') {
    const up = S.appts.filter(a => a.date >= t || ['agendada', 'confirmada'].includes(a.status)).sort((a, b) => (a.date + (a.time || '')).localeCompare(b.date + (b.time || '')));
    const past = S.appts.filter(a => a.date < t && !['agendada', 'confirmada'].includes(a.status)).sort((a, b) => b.date.localeCompare(a.date)).slice(0, 10);
    const month = S.appts.filter(a => a.date.slice(0, 7) === t.slice(0, 7));
    const real = month.filter(a => a.status === 'realizada').length, falt = month.filter(a => a.status === 'faltou').length;
    html += `<h2>Este mês</h2><div class="card pad"><div class="stats">
      <div class="stat"><div class="v">${month.length}</div><div class="l">agendadas</div></div>
      <div class="stat"><div class="v">${real}</div><div class="l">realizadas</div></div>
      <div class="stat"><div class="v">${falt}</div><div class="l">faltas</div></div></div></div>`;
    const ar = a => `<div class="row">${checkBtn(a.status === 'realizada', ['agendada', 'confirmada'].includes(a.status) ? `done:appt:${a.id}` : 'none')}
      <div class="body" data-act="open:appt:${a.id}"><div class="t">${esc(pname(a.patientId))}</div><div class="s">${fmtDate(a.date)}${a.time ? ' · ' + a.time : ''} · ${esc(a.kind || 'Consulta')}</div></div>
      ${a.link && ['agendada', 'confirmada'].includes(a.status) ? `<a class="pill a" href="${esc(a.link)}" target="_blank" rel="noopener" style="text-decoration:none">Entrar</a>` : `<span class="pill">${a.status}</span>`}</div>`;
    html += `<h2>Próximas</h2>` + (up.length ? `<div class="card">${up.map(ar).join('')}</div>` : empty('Nenhuma consulta agendada.'));
    if (past.length) html += `<h2>Recentes</h2><div class="card">${past.map(ar).join('')}</div>`;
  } else if (s === 'lista') {
    const list = [...S.patients].sort((a, b) => a.name.localeCompare(b.name));
    html += `<h2>Todos</h2>` + (list.length ? `<div class="card">${list.map(p => {
      const next = S.appts.filter(a => a.patientId === p.id && a.date >= t && ['agendada', 'confirmada'].includes(a.status)).sort((a, b) => a.date.localeCompare(b.date))[0];
      return `<div class="row"><div class="body" data-act="open:patient:${p.id}"><div class="t">${esc(p.name)}</div>
        <div class="s">${esc(p.goal || (p.type === 'mentoria' ? 'Mentoria' : 'Consultas'))}${next ? ' · próxima: ' + fmtDate(next.date) : ''}</div></div>
        ${p.contact ? `<a class="pill" style="text-decoration:none" href="https://wa.me/${esc(String(p.contact).replace(/\D/g, ''))}" target="_blank" rel="noopener">WhatsApp</a>` : ''}
        <span class="tag">${p.type === 'mentoria' ? 'Mentoria' : ''}</span></div>`;
    }).join('')}</div>` : empty('Cadastre seus pacientes para agendar consultas e acompanhar a evolução.'));
  } else {
    const ms = S.patients.filter(p => p.type === 'mentoria').sort((a, b) => (a.nextCheckin || '9').localeCompare(b.nextCheckin || '9'));
    html += `<h2>Check-ins semanais</h2>` + (ms.length ? `<div class="card">${ms.map(p => {
      const late = p.nextCheckin && p.nextCheckin < t;
      return `<div class="row">${checkBtn(false, `done:checkin:${p.id}`)}<div class="body" data-act="open:patient:${p.id}"><div class="t">${esc(p.name)}</div>
        <div class="s" ${late ? 'style="color:var(--accent)"' : ''}>${p.nextCheckin ? (late ? 'Atrasado · ' : '') + fmtDate(p.nextCheckin) : 'Defina a data do check-in'}${p.lastCheckin ? ' · último: ' + fmtDate(p.lastCheckin) : ''}</div></div></div>`;
    }).join('')}</div>` : empty('Nenhum paciente em mentoria.<br>Ao cadastrar, escolha “Mentoria / acompanhamento”.'));
  }
  return html;
}

function viewConteudo() {
  const t = today();
  const wkStart = addDays(t, -((new Date().getDay() + 6) % 7)), wkEnd = addDays(wkStart, 6);
  const week = S.posts.filter(p => p.date >= wkStart && p.date <= wkEnd);
  let html = header('Conteúdo', `Esta semana: ${week.length} planejados · ${week.filter(p => p.status === 'postado').length} postados`);
  html += seg('conteudo', [['calendario', 'Calendário'], ['ideias', 'Ideias'], ['metricas', 'Métricas'], ['funil', 'Funil']]);

  const pr = p => `<div class="row ${p.status === 'postado' ? 'done' : ''}">${checkBtn(p.status === 'postado', p.status === 'postado' ? 'none' : `done:post:${p.id}`)}
      <div class="body" data-act="open:post:${p.id}"><div class="t">${esc(p.title)}</div><div class="s">${esc(p.format)} · ${esc(p.network)}${p.hook ? ' · “' + esc(p.hook) + '”' : ''}</div></div>

    const list = S.posts.filter(p => p.date && p.date >= addDays(t, -7)).sort((a, b) => a.date.localeCompare(b.date));
    const by = {}; list.forEach(p => (by[p.date] = by[p.date] || []).push(p));
    const days = Object.keys(by);
    html += days.length ? days.map(d => `<h2 ${d === t ? 'style="color:var(--accent)"' : ''}>${fmtDate(d)}</h2><div class="card">${by[d].map(pr).join('')}</div>`).join('')

  } else if (s === 'ideias') {

      <div class="body" data-act="open:post:${p.id}"><div class="t">${esc(p.title)}</div><div class="s">${esc(p.format)} · ${esc(p.network)}${p.hook ? ' · “' + esc(p.hook) + '”' : ''}</div></div>
      <button class="pill a" data-act="stage:${p.id}">${p.status}</button></div>`).join('')}</div>` : empty('Guarde aqui toda ideia que surgir.<br>Toque na etapa para avançar: ideia → roteiro → gravado.'));
  } else if (s === 'metricas') {
    const list = [...S.metrics].sort((a, b) => b.date.localeCompare(a.date));
    const [a, b] = list;
    const delta = (k) => a && b && a[k] !== '' && b[k] !== '' ? (a[k] - b[k]) : null;
    const dl = (k) => { const d = delta(k); return d === null ? '&nbsp;' : `<span class="${d >= 0 ? 'accent' : ''}">${d >= 0 ? '+' : ''}${num(d)}</span> desde ${fmtDate(b.date)}`; };
    html += `<h2>Seguidores</h2>`;
    html += a ? `<div class="card pad"><div class="two">
        <div><div class="l muted small">Instagram</div><div class="big">${num(a.ig)}</div><div class="small muted">${dl('ig')}</div></div>
        <div><div class="l muted small">TikTok</div><div class="big">${num(a.tt)}</div><div class="small muted">${dl('tt')}</div></div></div></div>
        <div class="card pad"><div class="two"><div class="stat"><div class="v">${a.reach !== '' && a.reach != null ? num(a.reach) : '–'}</div><div class="l">alcance da semana</div></div>
        <div class="stat"><div class="v">${a.eng !== '' && a.eng != null ? num(a.eng) + '%' : '–'}</div><div class="l">engajamento</div></div></div></div>
        <h2>Histórico</h2><div class="card">${list.map(m => `<div class="row"><div class="body" data-act="open:metric:${m.id}"><div class="t">${fmtDate(m.date)}</div><div class="s">IG ${num(m.ig)} · TikTok ${num(m.tt)}</div></div></div>`).join('')}</div>`
      : empty('Registre seus números uma vez por semana<br>para ver o crescimento. <b class="accent">+10 XP</b> a cada registro.');
  } else {
    const list = [...S.funnel].sort((a, b) => b.month.localeCompare(a.month));
    const f = list[0];
    html += `<h2>Funil de vendas</h2>`;
    if (f) {
      const mx = Math.max(+f.leads || 0, 1), pct = (x, y) => y ? Math.round(x / y * 100) + '%' : '–';
      html += `<div class="card pad stack"><div class="between"><h3>${monthName(f.month)}</h3><span class="muted small">${esc(f.product || '')}</span></div>

          <div><div class="between small" style="margin-bottom:6px"><span>${l}</span><span><b class="p">${num(v)}</b> <span class="muted">${p}</span></span></div>${bar((+v || 0) / mx * 100, i === 2 ? '' : 'dark')}</div>`).join('')}
        <div class="between" style="padding-top:8px"><span class="muted small">Faturamento</span><span class="big" style="font-size:24px">${money(f.revenue)}</span></div>
        <div class="muted small">Conversão total: ${pct(f.sales, f.leads)} dos leads viraram venda</div></div>`;
      if (list.length > 1) html += `<h2>Meses anteriores</h2><div class="card">${list.slice(1).map(m => `<div class="row"><div class="body" data-act="open:funnel:${m.id}"><div class="t">${monthName(m.month)}</div><div class="s">${num(m.leads)} leads · ${num(m.sales)} vendas · ${money(m.revenue)}</div></div></div>`).join('')}</div>`;
      html += `<div style="text-align:center;margin-top:16px"><button class="link" data-act="open:funnel:${f.id}">Editar este mês</button></div>`;
    } else html += empty('Acompanhe mês a mês: leads → conversas → vendas.<br>Assim você vê qual conteúdo gera venda.');
  }
  return html;
}

function viewSaude() {
  const t = today();
  let html = header('Saúde', 'Cuidar de você também conta pontos');
  html += seg('saude', [['habitos', 'Hábitos'], ['glicemia', 'Glicemia'], ['cuidados', 'Cuidados']]);
  const s = UI.seg.saude;
  if (s === 'habitos') {
    const hl = S.habitLog[t] || [];
    const hStreak = id => { let d = hl.includes(id) ? t : addDays(t, -1), n = 0; while ((S.habitLog[d] || []).includes(id)) { n++; d = addDays(d, -1); } return n; };
    const last7 = [...Array(7)].map((_, i) => addDays(t, i - 6));
    html += `<h2>Hoje</h2>` + (S.habits.length ? `<div class="card">${S.habits.map(h => {
      const on = hl.includes(h.id), st = hStreak(h.id);
      return `<div class="row ${on ? 'done' : ''}">${checkBtn(on, `habit:${h.id}`)}<div class="body" data-act="open:habit:${h.id}"><div class="t">${esc(h.name)}</div>
        <div class="s">${st ? st + (st === 1 ? ' dia seguido · ' : ' dias seguidos · ') : ''}+${h.xp || 5} XP</div></div>
        <div style="display:flex;gap:3px">${last7.map(d => `<i style="width:6px;height:18px;border-radius:3px;background:${(S.habitLog[d] || []).includes(h.id) ? 'var(--accent)' : 'var(--line)'}"></i>`).join('')}</div></div>`;
    }).join('')}</div>` : empty('Nenhum hábito.')) + `<div style="text-align:center;margin-top:16px"><button class="link" data-act="open:habit:">+ Novo hábito</button></div>`;
  } else if (s === 'glicemia') {
    const from = addDays(t, -13), rec = S.glucose.filter(g => g.date >= from && g.value);
    const avg = rec.length ? Math.round(rec.reduce((s, g) => s + +g.value, 0) / rec.length) : null;
    const tir = rec.length ? Math.round(rec.filter(g => g.value >= 70 && g.value <= 180).length / rec.length * 100) : null;
    const lows = rec.filter(g => g.value < 70).length;
    html += `<h2>Últimos 14 dias</h2><div class="card pad"><div class="stats">
      <div class="stat"><div class="v">${tir ?? '–'}${tir !== null ? '<span style="font-size:14px">%</span>' : ''}</div><div class="l">no alvo 70–180</div></div>
      <div class="stat"><div class="v">${avg ?? '–'}</div><div class="l">média mg/dL</div></div>
      <div class="stat"><div class="v">${lows}</div><div class="l">hipoglicemias</div></div></div>
      ${tir !== null ? `<div style="margin-top:18px">${bar(tir)}</div>` : ''}</div>`;
    const list = [...S.glucose].sort((a, b) => (b.date + (b.time || '')).localeCompare(a.date + (a.time || ''))).slice(0, 40);
    const by = {}; list.forEach(g => (by[g.date] = by[g.date] || []).push(g));
    const col = v => v < 70 ? 'color:var(--low)' : v > 180 ? 'color:var(--accent)' : '';
    html += Object.keys(by).length ? Object.keys(by).map(d => `<h2>${fmtDate(d)}</h2><div class="card">${by[d].map(g => `<div class="row"><div class="body" data-act="open:glucose:${g.id}">
        <div class="t"><span class="p" style="font-weight:700;${col(g.value)}">${g.value}</span> <span class="muted small">mg/dL</span></div>
        <div class="s">${[g.time, g.insulin ? g.insulin + 'U ' + (g.itype || '').toLowerCase() : '', g.carbs ? g.carbs + 'g carbo' : '', esc(g.note)].filter(Boolean).join(' · ')}</div></div></div>`).join('')}</div>`).join('')
      : `<h2>Registros</h2>` + empty('Anote glicemia, insulina e carboidratos.<br><b class="accent">+2 XP</b> a cada registro.');
  } else {
    html += `<h2>Trocas de dispositivo</h2><div class="card">${S.devices.map(d => {
      const due = d.last ? addDays(d.last, +d.interval || 1) : null, left = due ? diffDays(due, t) : null;
      const txt = !d.last ? 'Informe a última troca' : left < 0 ? `Atrasado ${-left} ${-left === 1 ? 'dia' : 'dias'}` : left === 0 ? 'Trocar hoje' : `Faltam ${left} ${left === 1 ? 'dia' : 'dias'}`;
      return `<div class="row"><div class="body" data-act="open:device:${d.id}"><div class="t">${esc(d.name)}</div><div class="s" ${left !== null && left <= 0 ? 'style="color:var(--accent)"' : ''}>${txt}</div></div>
        <button class="btn sm ${left !== null && left <= 0 ? 'acc' : 'ghost'}" data-act="done:device:${d.id}">Troquei hoje</button></div>`;
    }).join('')}</div><div style="text-align:center;margin-top:16px"><button class="link" data-act="open:device:">+ Dispositivo</button></div>`;
    const ex = [...S.exams].sort((a, b) => (a.done - b.done) || (a.date || '').localeCompare(b.date || ''));
    html += `<h2>Consultas e exames</h2>` + (ex.length ? `<div class="card">${ex.map(e => `<div class="row ${e.done ? 'done' : ''}">${checkBtn(e.done, e.done ? 'none' : `done:exam:${e.id}`)}
      <div class="body" data-act="open:exam:${e.id}"><div class="t">${esc(e.name)}</div><div class="s">${fmtDate(e.date)}${e.time ? ' · ' + e.time : ''}</div></div></div>`).join('')}</div>`
      : empty('Endócrino, HbA1c, oftalmo, receitas...<br>Tudo aparece na sua lista no dia certo.'));
  }
  return html;
}

function viewDinheiro() {
  let html = header('Dinheiro', 'Gastos pessoais e metas');
  html += seg('dinheiro', [['gastos', 'Gastos'], ['metas', 'Metas']]);
  if (UI.seg.dinheiro === 'gastos') {
    const m = UI.month, list = S.expenses.filter(e => (e.date || '').slice(0, 7) === m).sort((a, b) => b.date.localeCompare(a.date));
    const total = list.reduce((s, e) => s + +e.value, 0);
    const byCat = {}; list.forEach(e => byCat[e.cat] = (byCat[e.cat] || 0) + +e.value);
    const cats = Object.entries(byCat).sort((a, b) => b[1] - a[1]);
    html += `<div class="between" style="margin:28px 4px 12px"><button data-act="month:-1" class="p" style="font-size:20px;padding:0 8px">‹</button>
      <span class="p" style="font-weight:600">${monthName(m)}</span><button data-act="month:1" class="p" style="font-size:20px;padding:0 8px">›</button></div>`;
    html += `<div class="card pad stack"><div><div class="muted small">Total gasto</div><div class="big">${money(total)}</div></div>`;
    if (S.budget) {
      const p = total / S.budget * 100;
      html += `<div>${bar(p)}<div class="between small" style="margin-top:8px"><span class="muted">${Math.round(p)}% do orçamento</span>
        <button class="link" data-act="budget">${total <= S.budget ? 'Restam ' + money(S.budget - total) : 'Passou ' + money(total - S.budget)}</button></div></div>`;
    } else html += `<button class="link" data-act="budget" style="text-align:left">Definir orçamento mensal</button>`;
    html += `</div>`;
    if (cats.length) html += `<h2>Por categoria</h2><div class="card pad stack">${cats.map(([c, v]) => `<div><div class="between small" style="margin-bottom:6px"><span>${c}</span><span class="p" style="font-weight:600">${money(v)}</span></div>${bar(v / cats[0][1] * 100, 'dark')}</div>`).join('')}</div>`;
    html += `<h2>Lançamentos</h2>` + (list.length ? `<div class="card">${list.map(e => `<div class="row"><div class="body" data-act="open:expense:${e.id}"><div class="t">${esc(e.desc || e.cat)}</div><div class="s">${fmtDate(e.date)} · ${e.cat}</div></div><span class="p" style="font-weight:600">${money(e.value)}</span></div>`).join('')}</div>` : empty('Nenhum gasto neste mês.'));
  } else {
    html += `<h2>Suas metas</h2>` + (S.goals.length ? S.goals.map(g => {
      const p = g.target ? (+g.current || 0) / g.target * 100 : 0;
      return `<div class="card pad stack"><div class="between"><div data-act="open:goal:${g.id}" style="cursor:pointer"><h3>${esc(g.name)}</h3>
        <div class="muted small">${g.deadline ? 'até ' + fmtDate(g.deadline) : 'sem prazo'}</div></div><span class="p accent" style="font-weight:700">${Math.round(p)}%</span></div>
        ${bar(p)}<div class="between"><span class="small"><b class="p">${money(g.current)}</b> <span class="muted">de ${money(g.target)}</span></span>
        ${p < 100 ? `<button class="btn sm" data-act="deposit:${g.id}">Guardar</button>` : '<span class="pill a">Concluída</span>'}</div></div>`;
    }).join('') : empty('Crie uma meta e guarde aos poucos.<br><b class="accent">+15 XP</b> a cada depósito, <b class="accent">+100 XP</b> ao concluir.'));
  }
  return html;
}

function profile() {
  const L = level(S.xp), st = streak();
  const days = Object.values(S.history).filter(v => v > 0).length;
  openForm({
    title: `Nível ${L.lv} · ${L.title}`, saveLabel: 'Salvar',
    fields: [{ k: 'name', label: 'Como quer ser chamada?', value: S.name, ph: 'Seu nome' }],
    onSave: v => { S.name = v.name; save(); render(); }
  });
  const sheets = document.querySelectorAll('.sheet'), sh = sheets[sheets.length - 1].querySelector('form');
  const info = document.createElement('div');
  info.innerHTML = `<div class="card pad" style="box-shadow:none;background:var(--bg);margin-bottom:18px">
    <div class="between small" style="margin-bottom:8px"><span><b class="p">${S.xp} XP</b> no total</span><span class="muted">faltam ${L.need - L.rest} para o nível ${L.lv + 1}</span></div>${bar(L.rest / L.need * 100)}
    <div class="stats" style="margin-top:18px"><div class="stat"><div class="v">${st}</div><div class="l">dias seguidos</div></div>
    <div class="stat"><div class="v">${days}</div><div class="l">dias ativos</div></div>
    <div class="stat"><div class="v">${S.tasks.filter(x => x.done).length}</div><div class="l">tarefas feitas</div></div></div></div>
    <div class="muted small" style="margin-bottom:18px">XP: tarefa 10–30 · consulta 20 · check-in 25 · post 30 · hábito 5–10. Faça pelo menos uma coisa por dia para manter a sequência.</div>`;
  sh.prepend(info);
  const bk = document.createElement('div');
  bk.innerHTML = `<h2 style="margin-top:26px">Seus dados</h2><p class="muted small" style="margin:0 0 12px">Ficam salvos só neste aparelho. Faça backup de vez em quando.</p>
    <div class="actions" style="margin-top:0"><button type="button" class="btn ghost" id="exp">Exportar backup</button><button type="button" class="btn ghost" id="imp">Importar</button></div>
    <input type="file" id="impf" accept="application/json" hidden>`;
  sh.append(bk);
  bk.querySelector('#exp').onclick = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' }));
    a.download = `prumo-backup-${today()}.json`; a.click();
  };
  bk.querySelector('#imp').onclick = () => bk.querySelector('#impf').click();
  bk.querySelector('#impf').onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    f.text().then(txt => {
      try { const d = JSON.parse(txt); if (!confirm('Substituir os dados atuais pelo backup?')) return; S = Object.assign(DEF(), d); save(); closeSheet(); render(); toast('Backup restaurado'); }
      catch (err) { alert('Arquivo inválido'); }
    });
  };
}

/* ===================== navegação & eventos ===================== */
const ICONS = {
  hoje: '<path d="M4 6h16M4 12h16M4 18h10"/>',
  pacientes: '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',
  conteudo: '<rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".6" fill="currentColor"/>',
  saude: '<path d="M12 21s-8-5-8-11a4.5 4.5 0 018-3 4.5 4.5 0 018 3c0 6-8 11-8 11z"/>',
  dinheiro: '<rect x="2.5" y="6" width="19" height="13" rx="3"/><path d="M2.5 10h19M7 15h3"/>'
};
const TABS = [['hoje', 'Tarefas'], ['pacientes', 'Pacientes'], ['conteudo', 'Conteúdo'], ['saude', 'Saúde'], ['dinheiro', 'Dinheiro']];
function render() {
  const v = { hoje: viewHoje, pacientes: viewPacientes, conteudo: viewConteudo, saude: viewSaude, dinheiro: viewDinheiro }[UI.tab];
  document.getElementById('app').innerHTML = v();
  document.getElementById('nav').innerHTML = TABS.map(([k, l]) => `<button class="${UI.tab === k ? 'on' : ''}" data-tab="${k}">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[k]}</svg>${l}</button>`).join('');
}
function fab() {
  const t = UI.tab, s = UI.seg[t];
  if (t === 'hoje') return ed.task();
  if (t === 'pacientes') return s === 'agenda' ? ed.appt() : ed.patient(undefined);
  if (t === 'conteudo') return s === 'metricas' ? ed.metric() : s === 'funil' ? ed.funnel() : ed.post(undefined, s === 'calendario');
  if (t === 'saude') return s === 'habitos' ? ed.habit() : s === 'glicemia' ? ed.glucose() : ed.exam();
  if (t === 'dinheiro') return s === 'metas' ? ed.goal() : ed.expense();
}
document.getElementById('fab').onclick = fab;
document.addEventListener('click', e => {
  const el = e.target.closest('[data-tab],[data-seg],[data-filter],[data-act]');
  if (!el) return;
  if (el.dataset.tab) { UI.tab = el.dataset.tab; render(); scrollTo(0, 0); return; }
  if (el.dataset.seg) { const [t, s] = el.dataset.seg.split(':'); UI.seg[t] = s; render(); return; }
  if (el.dataset.filter) { UI.filter = el.dataset.filter; render(); return; }
  const [a, b, c] = el.dataset.act.split(':');
  if (a === 'none') return;
  if (a === 'done') {
    el.classList.add('on', 'pop');
    setTimeout(() => { complete(b, c); render(); }, 320);
  } else if (a === 'undo') {
    const x = S.tasks.find(i => i.id === b); x.done = false; delete x.doneAt;
    gain(-({ 1: 10, 2: 20, 3: 30 }[x.prio] || 20)); render();
  } else if (a === 'open') {
    if (['task', 'appt', 'checkin', 'post', 'device', 'exam'].includes(b)) openItem(b, c || undefined);
    else ed[b](c || undefined);
  } else if (a === 'habit') {
    const t = today(), log = S.habitLog[t] = S.habitLog[t] || [], h = S.habits.find(x => x.id === b);
    if (log.includes(b)) { S.habitLog[t] = log.filter(x => x !== b); gain(-(+h.xp || 5)); render(); }
    else {
      log.push(b); el.classList.add('on', 'pop');
      setTimeout(() => {
        gain(+h.xp || 5, h.name);
        if (S.habitLog[t].length === S.habits.length) gain(20, 'Todos os hábitos!');
        render();
      }, 320);
    }
  } else if (a === 'stage') {
    const p = S.posts.find(x => x.id === b), i = POST_STATUS.indexOf(p.status);
    if (i < POST_STATUS.length - 1) {
      p.status = POST_STATUS[i + 1];
      if (p.status === 'postado') { if (!p.date || p.date > today()) p.date = today(); gain(30, 'Conteúdo postado'); }
      else gain(5, 'Etapa: ' + p.status);
      render();
    }
  } else if (a === 'goto') { UI.tab = b; UI.seg[b] = c; render(); scrollTo(0, 0); }
  else if (a === 'toggleDone') { UI.showDone = !UI.showDone; render(); }
  else if (a === 'profile') profile();
  else if (a === 'budget') ed.budget();
  else if (a === 'deposit') ed.deposit(b);
  else if (a === 'month') { const d = new Date(UI.month + '-15T12:00'); d.setMonth(d.getMonth() + +b); UI.month = ymd(d).slice(0, 7); render(); }
});
render();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => { });
</script>
</body>
</html>
