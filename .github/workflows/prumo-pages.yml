name: Publicar Prumo

# Publica somente a pasta prumo/ no branch gh-pages (usado pelo GitHub Pages)
on:
  push:
    branches: [claude/personal-organization-app-0aidfk]
    paths: ['prumo/**', '.github/workflows/prumo-pages.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prumo-pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enviar a pasta prumo/ para o branch gh-pages
        run: |
          cd prumo
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898099+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Publica Prumo (${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
